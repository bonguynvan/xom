<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Xóm Peti · nhạc lofi</title>
  <meta name="description" content="Một xóm nhỏ nhìn từ trên cao, có nhạc lofi. Người trong xóm đi lại, nói chuyện theo giờ Việt Nam.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Peti">
  <meta property="og:url" content="https://xom.peti.vn/">
  <meta property="og:title" content="Xóm Peti · nhạc lofi">
  <meta property="og:description" content="Một xóm nhỏ nhìn từ trên cao, có nhạc lofi. Người trong xóm đi lại, nói chuyện theo giờ Việt Nam.">
  <meta property="og:image" content="https://xom.peti.vn/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Toàn cảnh Xóm Peti nhìn từ trên cao">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://xom.peti.vn/og.jpg">
  <meta name="theme-color" content="#fff6e5">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="/css/xom.css">
  <script type="module" src="/js/main.js"></script>
</head>
<body>
  <header class="top">
    <a class="brand" href="https://peti.vn" title="Các trò khác của Peti"><span class="brand-mark" aria-hidden="true"></span>Xóm <em>Peti</em></a>
    <span class="online" id="online" hidden aria-live="polite"></span>
    <button type="button" class="join" id="join" hidden>🏠 Về xóm</button>
    <button type="button" class="find" id="find-me" hidden>📍 Mình</button>
    <button type="button" class="music" id="music" aria-pressed="false" title="Nhạc lofi tự sáng tác ngay trong trình duyệt">🎵 Bật nhạc</button>
    <a class="github" href="https://github.com/bonguynvan/xom" target="_blank" rel="noopener" title="Mã nguồn mở, ai cũng đóng góp được">GitHub ↗</a>
    <div class="clock" id="clock" aria-live="off">--:--</div>
  </header>

  <main class="stage">
    <div class="loa" id="loa" hidden role="status">
      <span class="loa-tag" aria-hidden="true">📢 Loa phường</span>
      <span class="loa-window"><span class="loa-text" id="loa-text"></span></span>
    </div>
    <canvas id="street" tabindex="0" aria-label="Bản đồ cả xóm. Kéo để xem quanh xóm, lăn chuột hoặc chụm hai ngón để phóng to."></canvas>
    <div class="splash" id="splash" role="status">
      <p class="splash-title">Đang dọn xóm…</p>
      <p class="splash-sub">Quét sân, kê ghế nhựa, gọi mọi người ra đường</p>
      <span class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></span>
    </div>
    <p class="hint" id="hint">Kéo để xem quanh xóm · lăn chuột để phóng to</p>
  </main>

  <dialog class="join-dialog" id="join-dialog" aria-labelledby="join-title">
    <form id="join-form">
      <h2 id="join-title">🏠 Về xóm</h2>
      <p class="join-lede">Nhân vật của bạn sẽ đi chợ, ngồi quán, tán chuyện với cả xóm cho tới khi bạn đóng trang. Ai đang xem cũng thấy bạn.</p>
      <label class="join-label" for="join-name">Tên trong xóm</label>
      <input id="join-name" maxlength="24" required autocomplete="nickname" spellcheck="false">
      <fieldset class="join-looks">
        <legend>Kiểu người</legend>
        <div class="looks" id="join-looks"></div>
      </fieldset>
      <p class="join-error" id="join-error" hidden role="alert"></p>
      <div class="join-actions">
        <button type="button" class="btn-ghost" id="join-cancel">Thôi</button>
        <button type="submit" class="btn-go" id="join-go">Vào xóm</button>
      </div>
    </form>
  </dialog>
</body>
</html>
